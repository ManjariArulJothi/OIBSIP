<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${book.id} == null ? 'Add Book' : 'Edit Book')}"></head>
<body>
<nav th:replace="~{fragments/header :: adminNav('books')}"></nav>

<div class="container" style="max-width: 620px;">
    <div class="page-header" style="margin-bottom: 20px;">
        <div class="page-title-group">
            <h2 th:text="${book.id} == null ? 'Add New Book' : 'Edit Book Record'">Add Book</h2>
            <p class="page-subtitle">Fill in the book details to update the library inventory.</p>
        </div>
    </div>

    <div class="card">
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/books/save}" th:object="${book}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="form-group">
                <label>Book Title</label>
                <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Design Patterns" required autofocus>
                <div class="form-help" th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:var(--danger);"></div>
            </div>

            <div class="form-group">
                <label>Author</label>
                <input type="text" th:field="*{author}" class="form-control" placeholder="e.g. Erich Gamma, Richard Helm" required>
                <div class="form-help" th:if="${#fields.hasErrors('author')}" th:errors="*{author}" style="color:var(--danger);"></div>
            </div>

            <div class="form-group">
                <label>ISBN</label>
                <input type="text" th:field="*{isbn}" class="form-control" placeholder="e.g. 9780201633610" required>
                <div class="form-help" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}" style="color:var(--danger);"></div>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" th:field="*{category}" list="categoryList" class="form-control" placeholder="e.g. Computer Science, Fiction" required>
                <datalist id="categoryList">
                    <option th:each="cat : ${categories}" th:value="${cat}"></option>
                </datalist>
                <div class="form-help" th:if="${#fields.hasErrors('category')}" th:errors="*{category}" style="color:var(--danger);"></div>
            </div>

            <div class="form-group">
                <label>Total Copies (Quantity)</label>
                <input type="number" th:field="*{totalQuantity}" class="form-control" min="0" required>
                <div class="form-help">Available copies will adjust based on total quantity.</div>
                <div class="form-help" th:if="${#fields.hasErrors('totalQuantity')}" th:errors="*{totalQuantity}" style="color:var(--danger);"></div>
            </div>

            <div style="display:flex; gap:12px; margin-top:24px;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Save Book</button>
                <a class="btn btn-outline" th:href="@{/admin/books}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
