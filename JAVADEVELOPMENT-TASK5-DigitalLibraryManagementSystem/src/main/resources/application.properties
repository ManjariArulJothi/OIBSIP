spring.application.name=library-management

# ==============================
# DEFAULT: File-based H2 database (zero setup - works out of the box)
# Data persists in ./data/librarydb.mv.db between restarts
# ==============================
spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================
# TO USE MYSQL INSTEAD: comment out the H2 block above and uncomment below,
# then create the DB first:  CREATE DATABASE library_db;
# ==============================
#spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Library business rules
library.fine.per-day=5
library.loan.period-days=14
library.reservation.hold-hours=48

logging.level.org.springframework.security=INFO
